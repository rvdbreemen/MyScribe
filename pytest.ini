[pytest]
testpaths = tests
# A gpu test needs a CUDA device and real model weights, so it cannot run on a
# machine that has neither and cannot be part of the loop you run while you
# work. Excluded here rather than skipped inside the test, so the default run
# does not import torch to find out. Run them with `pytest -m gpu`: a -m on the
# command line replaces this one.
markers =
    gpu: needs a CUDA device and downloaded model weights
addopts = -m "not gpu"
# A test that stalls should say where. Nothing here legitimately takes two
# minutes (the whole run takes about one), so when a test does, every thread's
# stack goes to stderr. The stall seen on this machine is CPython's Windows
# socketpair() emulation blocking in accept() while asyncio builds the event
# loop behind a TestClient - a loopback SYN going missing - and only the dump
# says so; the test code cannot.
faulthandler_timeout = 120
