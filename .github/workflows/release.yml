# Build the three artifacts, prove each one starts, and publish (TASK-040.04).
#
# Two ways in, and they differ in exactly one thing: a `v*` tag publishes a
# release, `workflow_dispatch` uploads the same artifacts and publishes
# nothing. Everything before that point is the same code path, so the dispatch
# run is a real rehearsal rather than a different build that happens to work.
#
# The version is checked against the tag before anything is built. A release
# whose artifact reports a different version than its tag is a support case
# that outlives the release, and the check costs one second. (It reads
# scribe.__version__, which is what the app serves at /health.)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  version:
    name: the tag is the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - id: read
        shell: bash
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('scribe/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "scribe.__version__ is $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match scribe.__version__ $version"
              exit 1
            fi
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            platform: macos-arm64
          - os: windows-latest
            name: windows-x64
            platform: windows-x64
          - os: ubuntu-latest
            name: linux-x64
            platform: linux-x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Make room (Linux)
        if: runner.os == 'Linux'
        # The same clearing ci.yml does, for a hungrier reason. The smoke test
        # runs a real first sync, and on Linux that pulls torch with its whole
        # CUDA stack - nvidia-cusolver alone is hundreds of megabytes - into a
        # runner that arrives with about 5 GB free. The AppImage had already
        # built; it was the sync behind the smoke that ran out of disk
        # (release run 35436498028).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
        shell: bash

      - name: Build ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # LGPL, from source, --disable-autodetect: the shipped binary must be
        # one we can account for, and the BtbN builds are Windows and Linux
        # only. The url and its sha256 come from packaging/tools.json rather
        # than from this file, so the pin has one home.
        run: |
          url=$(python3 -c "import json;print(json.load(open('packaging/tools.json'))['ffmpeg']['platforms']['macos-arm64']['source_url'])")
          sum=$(python3 -c "import json;print(json.load(open('packaging/tools.json'))['ffmpeg']['platforms']['macos-arm64']['sha256'])")
          mkdir -p packaging/build
          curl -Lsf "$url" -o packaging/build/ffmpeg-src.tar.xz
          # Absolute: the script cd's into its own work directory, so a
          # relative out-dir lands there and is deleted with it by the trap.
          bash packaging/build_ffmpeg_macos.sh "$PWD/packaging/build/ffmpeg-src.tar.xz" "$sum" "$PWD/packaging/build/ffmpeg"

      - name: Build the artifact and prove it starts
        shell: bash
        # --smoke runs the frozen launcher the build just produced: first sync,
        # the setup engine with `{}` answers over stdin, /health, a page, quit
        # (TASK-089.15). "The build produced a file" is not the thing a release
        # needs to be true. On a failure build_release.py prints the
        # launcher's own <home>/logs/launcher-smoke.log, because the Windows
        # binary is windowed and has no console of its own.
        #
        # The runner's own Python, and no uv here at all (TASK-089.24):
        # build_release.py is standard library only and makes its build
        # environment with the uv inside the payload, the one pinned by
        # version and sha256 in packaging/tools.json. `uv run` used to create
        # the whole project environment first, only to start a script that
        # never imports it - and the floating install script that provided uv
        # was a second, unpinned copy.
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="--ffmpeg-dir packaging/build/ffmpeg"; fi
          py=$(command -v python3 || command -v python)
          "$py" packaging/build_release.py --platform ${{ matrix.platform }} --smoke $extra

      - name: Sign (macOS)
        # Only when the secrets exist. An unsigned artifact is a real thing a
        # user can run past Gatekeeper with "Open Anyway", which is what the
        # dmg's note explains; a workflow that fails for want of a certificate
        # would stop releases that are otherwise fine.
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: echo "signing would run here"

      - name: Signing skipped (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE == ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: echo "::notice::MACOS_CERTIFICATE is not configured; shipping the ad-hoc signed app"

      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: echo "signing would run here"

      - name: Signing skipped (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE == ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: echo "::notice::WINDOWS_CERTIFICATE is not configured; the installer is unsigned"

      - uses: actions/upload-artifact@v4
        with:
          name: myscribe-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest what built these
        # Only where GitHub offers it. Build provenance is not available for a
        # user-owned private repository, and the attestation step failed the
        # whole publish over that - after three builds and their smoke tests
        # had passed (release run on v0.5.0, 2026-09-19). Same treatment as
        # signing: do it where it can be done, say so where it cannot, and
        # never lose a release that is otherwise sound.
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "artifacts/*"

      - name: Attestation skipped
        if: github.event.repository.private
        run: echo "::notice::build provenance is not available for user-owned private repositories; SHA256SUMS is published with the artifacts"

      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: packaging/release_kind.py
          sparse-checkout-cone-mode: false

      - name: Pre-release or release
        # A beta (v0.8.0b1) is published as a pre-release that does not become
        # Latest, so the README's download link keeps the stable one (TASK-100).
        id: kind
        run: |
          prerelease=$(python3 source/packaging/release_kind.py "${{ needs.version.outputs.version }}")
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "${{ needs.version.outputs.version }} is a pre-release: $prerelease"

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
          make_latest: ${{ steps.kind.outputs.prerelease == 'true' && 'false' || 'true' }}
