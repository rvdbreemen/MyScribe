# Tests on the three operating systems this app ships to (TASK-040.04).
#
# Installed the way a person installs a clone: `python install.py`, which
# fetches the uv pinned by version and sha256 in packaging/tools.json into
# .tools/bin, syncs .venv frozen from uv.lock, runs the setup engine with no
# answers, and ends on the proof report (TASK-089.17, TASK-089.24). Until then
# this file installed uv from its floating install script and ran a bare
# `uv sync --frozen`, which is not what any user gets - and the path every new
# user walks was the one path CI never ran.
#
# The suite runs `-m "not gpu"` by default (pytest.ini); no runner here has a
# card, so the GPU marks stay excluded and TASK-040.01's RTX criterion remains
# a thing only real hardware can answer. What the runners do answer is whether
# the install and its proof complete on a machine with no NVIDIA card at all
# (TASK-093 criterion 3): the proof's transcription smoke runs on the CPU.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Make room (Linux)
        if: runner.os == 'Linux'
        # Before the install, because install.py checks the free space before
        # it syncs and its proof checks the doctor's 10 GB floor (TASK-043).
        # A hosted ubuntu runner arrives with about 5 GB free, most of it
        # spent on toolchains this project never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h / | tail -1
        shell: bash

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        # Before the install, because its proof needs ffmpeg. There is no
        # pinned ffmpeg download for macOS (the release builds its own), and
        # install.py never runs a package manager (ADR-017), so on a Mac the
        # person runs this line - and so does CI. On Windows and Linux
        # install.py fetches the pinned ffmpeg into .tools/bin when none is on
        # PATH, which is why the apt and choco steps are gone.
        run: brew install ffmpeg
        shell: bash

      - name: Install through install.py
        # --non-interactive: the questions stay open, as they do for a person
        # who presses Enter through nothing. The proof's own exit code is
        # printed, not returned: the Doctor step below is the gate.
        run: |
          # python on Windows: there `python3` can be the Store's alias,
          # which opens a page instead of running anything.
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; else py=python3; fi
          "$py" --version
          "$py" install.py --non-interactive
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PY=$GITHUB_WORKSPACE/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "PY=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: The lockfile matches pyproject.toml
        # The uv install.py fetched, not a second one.
        run: |
          uv --version
          uv lock --check
        shell: bash

      - name: Doctor
        # Before the suite, because a doctor that fails explains a suite that
        # fails, and it costs seconds. --no-gpu: no runner has a card.
        run: '"$PY" -m scribe.doctor --no-gpu'
        shell: bash

      - name: The Ollama pin still matches its release
        if: runner.os == 'Linux'
        # scribe/ollama_release.json pins the installer MyScribe offers when a
        # machine has no Ollama (ADR-017, M7). One GET of the tag's metadata,
        # one GET of its sha256sum.txt and one HEAD per artifact: size and
        # digest are compared without downloading a 1.57 GB installer. Red
        # here means the pin needs the release step in docs/RELEASING.md.
        # Once, on Linux: three runners asking would be three times the same
        # answer against the API's rate limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$PY" -m scribe.ollama_setup --check-pin'
        shell: bash

      - name: Suite
        if: runner.os != 'Windows'
        run: '"$PY" -m pytest -q'
        shell: bash

      - name: Suite (Windows, in halves)
        if: runner.os == 'Windows'
        # CLAUDE.md: the whole-suite run stalls intermittently on Windows -
        # CPython's socketpair emulation behind TestClient, see pytest.ini. The
        # halves are the documented workaround, not a way of hiding a failure.
        run: |
          "$PY" -m pytest -q tests/test_[a-r]*.py
          "$PY" -m pytest -q tests/test_[s-z]*.py
        shell: bash
